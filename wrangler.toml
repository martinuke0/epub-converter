# Epub — Cloudflare Worker + Containers + R2 + Static Assets
# Deploy: npm run build:web && npx wrangler deploy
# Requires Docker running locally when image= points at a Dockerfile (linux/amd64).

name = "epub-converter"
main = "apps/api/functions/worker.ts"
compatibility_date = "2025-09-16"
compatibility_flags = ["nodejs_compat"]

[vars]
MAX_FILE_SIZE_MB = "80"
# Optional external Calibre fallback (local Compose / custom host).
# Prefer the CALIBRE_CONVERTER container binding in production — no CONVERTER_URL needed.
# CONVERTER_URL = "http://localhost:8090"

# Serve the Vite build; /api/* runs the Worker first.
[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# R2 for temporary upload staging (Worker puts bytes, then deletes after convert).
# Create buckets once:
#   npx wrangler r2 bucket create epub-converter-tmp
#   npx wrangler r2 bucket create epub-converter-tmp-preview
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "epub-converter-tmp"
preview_bucket_name = "epub-converter-tmp-preview"

# Cloudflare Containers — Calibre ebook-convert sidecar
# class_name must match the exported Durable Object / Container class in worker.ts
[[containers]]
class_name = "CalibreConverter"
image = "./converter/Dockerfile"
instance_type = "standard-2"
max_instances = 3

[[durable_objects.bindings]]
name = "CALIBRE_CONVERTER"
class_name = "CalibreConverter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CalibreConverter"]
