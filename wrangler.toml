# Epub — Cloudflare Worker + Containers + R2 + Static Assets
# Deploy: npm run build:web && npx wrangler deploy
# Workers Builds can build the container image in Cloudflare; local Docker is optional.

name = "epub-converter"
main = "apps/api/functions/worker.ts"
compatibility_date = "2025-09-16"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# Default URL: https://epub-converter.<subdomain>.workers.dev

[vars]
MAX_FILE_SIZE_MB = "80"
RATE_LIMIT_MAX = "10"
RATE_LIMIT_WINDOW_SEC = "60"
MAX_CONCURRENT_PER_IP = "2"
MAX_CONCURRENT_GLOBAL = "5"
# Optional private mode — set as a secret, do not commit:
#   npx wrangler secret put ACCESS_TOKEN
# ACCESS_TOKEN is read from env/secrets when set; GuardPlugin requires X-Access-Token or ?token=
# Optional external Calibre fallback (local Compose / custom host).
# Prefer the CALIBRE_CONVERTER container binding in production — no CONVERTER_URL needed.
# CONVERTER_URL = "http://localhost:8090"

# Serve the Vite build; /api/* runs the Worker first.
[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# R2 for temporary upload staging (Worker puts bytes, then deletes after convert).
# Create buckets once:
#   npx wrangler r2 bucket create epub-converter-tmp
#   npx wrangler r2 bucket create epub-converter-tmp-preview
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "epub-converter-tmp"
preview_bucket_name = "epub-converter-tmp-preview"

# Workers KV for rate-limit + concurrency counters (required for multi-isolate abuse protection).
# Create once:
#   npx wrangler kv namespace create RATE_LIMIT
#   npx wrangler kv namespace create RATE_LIMIT --preview
# Then paste the ids below (id / preview_id).
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"

# Cloudflare Containers — Calibre ebook-convert sidecar
# class_name must match the exported Durable Object / Container class in worker.ts
[[containers]]
class_name = "CalibreConverter"
image = "./converter/Dockerfile"
instance_type = "standard-2"
max_instances = 3

[[durable_objects.bindings]]
name = "CALIBRE_CONVERTER"
class_name = "CalibreConverter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CalibreConverter"]

[triggers]
crons = ["*/10 * * * *"]
