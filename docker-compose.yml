services:
  converter:
    build:
      context: ./converter
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      CONVERTER_PORT: "8090"
      TEMP_DIR: /tmp/epub-convert
      TEMP_TTL_SECONDS: "3600"
      MAX_FILE_SIZE_MB: "80"
    volumes:
      - converter-tmp:/tmp/epub-convert
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  converter-tmp:
